name: DayDan App CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Reproducible install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify frontend
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify.sh

  browser-smoke:
    name: Playwright browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:smoke
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-failures
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  cross-browser-smoke:
    name: Playwright cross-browser critical smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser critical smoke
        run: npm run test:smoke:cross-browser
      - name: Upload cross-browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-failures
          if-no-files-found: ignore
          retention-days: 3
          path: |
            playwright-report/
            test-results/

  coverage:
    name: Unit/component coverage
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Collect coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unit
          name: daydan-app-unit
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
